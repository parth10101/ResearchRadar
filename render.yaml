services:
  - type: web
    name: research-radar
    env: python
    region: oregon
    plan: free
    buildCommand: "rm -rf frontend/node_modules frontend/package-lock.json && pip install -r requirements.txt && npm --prefix frontend install && npm --prefix frontend install @rolldown/binding-linux-x64-gnu && npm --prefix frontend run build"
    startCommand: "uvicorn research_radar.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.18.0
      - key: OPENALEX_API_KEY
        sync: false
      - key: DATABASE_URL
        value: postgresql://postgres.maoapmmpnwjcaftvlpfa:%5B%28%40%23%29%5D0parth@aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres
