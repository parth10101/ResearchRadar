<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResearchRadar | Citation Graph</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg: #07090e;
            --panel: #0d1117;
            --panel-elevated: #161b22;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --border: #30363d;
            --accent: #58a6ff;
            --roadmap: #f0883e;
            --foundation: #8957e5;
            --frontier: #238636;
            --standard: #388bfd;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* HEADER */
        header {
            height: 60px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background-color: var(--panel);
            justify-content: space-between;
        }
        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .tabs {
            display: flex;
            gap: 16px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: var(--text-main);
            background: var(--panel-elevated);
        }
        .tab-btn.active {
            color: var(--accent);
            background: rgba(88, 166, 255, 0.1);
        }

        /* LAYOUT */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .view-section {
            display: none;
            width: 100%;
            height: 100%;
        }
        .view-section.active {
            display: flex;
        }

        /* TIMELINE VIEW */
        #timeline-view {
            overflow-y: auto;
            padding: 40px;
            justify-content: center;
        }
        .timeline-container {
            max-width: 800px;
            width: 100%;
            position: relative;
        }
        .timeline-container::before {
            content: '';
            position: absolute;
            left: 20px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }
        .milestone-item {
            display: flex;
            margin-bottom: 30px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .milestone-item:hover {
            transform: translateX(5px);
        }
        .milestone-year-dot {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--panel-elevated);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--accent);
            z-index: 2;
            flex-shrink: 0;
        }
        .milestone-card {
            margin-left: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            flex: 1;
        }
        .milestone-card h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        /* CONSTELLATION VIEW */
        /* Left Sidebar */
        .sidebar {
            width: 320px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            background: var(--panel);
        }
        .filters {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            background: var(--panel-elevated);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        
        .paper-list {
            flex: 1;
            overflow-y: auto;
        }
        .list-item {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .list-item:hover {
            background: var(--panel-elevated);
        }
        .list-item.active {
            border-left: 4px solid var(--accent);
            background: var(--panel-elevated);
        }
        .list-item-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .list-item-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        /* Center Canvas */
        .canvas-container {
            flex: 1;
            position: relative;
            background: var(--bg);
        }
        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .scene-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .node-label {
            position: absolute;
            background: rgba(13, 17, 23, 0.85);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            pointer-events: none;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: none;
        }
        .node-label.visible {
            display: block;
        }
        .node-label.top-shared {
            border-color: rgba(63, 185, 80, 0.6);
            background: rgba(13, 25, 18, 0.95);
            box-shadow: 0 0 10px rgba(63, 185, 80, 0.25);
        }
        .rank-chip {
            display: inline-block;
            background: rgba(35, 134, 54, 0.35);
            color: #3fb950;
            border: 1px solid rgba(63, 185, 80, 0.5);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 3px;
            margin-right: 5px;
        }

        /* Right Panel */
        .right-panel {
            width: 480px;
            min-width: 360px;
            max-width: 800px;
            border-left: 1px solid var(--border);
            background: var(--panel);
            display: flex;
            flex-direction: column;
            position: relative;
            user-select: text;
        }
        .panel-resizer-left {
            position: absolute;
            left: -4px;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: ew-resize;
            z-index: 50;
        }
        .panel-resizer-left:hover, .panel-resizer-left.dragging {
            background: rgba(88, 166, 255, 0.4);
        }
        .focus-section {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
            max-height: 48%;
        }
        .vertical-splitter {
            height: 8px;
            background: var(--panel-elevated);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            cursor: ns-resize;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .vertical-splitter:hover, .vertical-splitter.dragging {
            background: rgba(88, 166, 255, 0.3);
        }
        .splitter-handle {
            width: 36px;
            height: 3px;
            background: var(--text-muted);
            border-radius: 2px;
            opacity: 0.6;
        }
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .badge.roadmap { background: rgba(240,136,62,0.15); color: var(--roadmap); }
        .badge.foundation { background: rgba(137,87,229,0.15); color: var(--foundation); }
        .badge.frontier { background: rgba(35,134,54,0.15); color: var(--frontier); }
        .badge.standard { background: rgba(56,139,253,0.15); color: var(--standard); }

        .focus-title {
            font-size: 1.3rem;
            line-height: 1.3;
            margin-bottom: 10px;
        }
        .focus-meta {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }
        .focus-summary {
            background: var(--bg);
            border-left: 3px solid var(--accent);
            padding: 10px 12px;
            font-size: 0.85rem;
            line-height: 1.45;
            color: var(--text-muted);
            margin-bottom: 14px;
            border-radius: 0 4px 4px 0;
            max-height: 140px;
            overflow-y: auto;
        }
        .focus-stats {
            display: flex;
            gap: 16px;
            font-size: 0.82rem;
            margin-bottom: 14px;
        }
        .btn-pdf {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            color: #fff;
            text-decoration: none;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s;
        }
        .btn-pdf-direct { background: #238636; }
        .btn-pdf-direct:hover { background: #2ea043; }
        .btn-pdf-doi { background: #1f6beb; }
        .btn-pdf-doi:hover { background: #388bfd; }
        .btn-pdf-scholar { background: #8957e5; }
        .btn-pdf-scholar:hover { background: #9e6aef; }
        .btn-pdf-book { background: #d29922; color: #0d1117; }
        .btn-pdf-book:hover { background: #e3b341; }
        .btn-pdf.disabled { background: var(--border); color: var(--text-muted); pointer-events: none; }

        .ref-status-badge {
            position: relative;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
            border-radius: 4px;
            padding: 2px 6px;
        }
        .ref-status-badge .tooltip-text {
            visibility: hidden;
            width: 260px;
            background-color: #161b22;
            color: #f0f6fc;
            text-align: left;
            border-radius: 6px;
            padding: 8px 12px;
            position: absolute;
            z-index: 100;
            bottom: 130%;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 16px rgba(0,0,0,0.6);
            border: 1px solid #30363d;
            font-size: 0.75rem;
            line-height: 1.4;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            white-space: normal;
            font-weight: 400;
        }
        .ref-status-badge:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }
        .ref-status-early { background: rgba(137,87,229,0.15); color: #a5d6ff; border: 1px solid rgba(137,87,229,0.4); }
        .ref-status-landmark { background: rgba(240,136,62,0.15); color: #ffa657; border: 1px solid rgba(240,136,62,0.4); }
        .ref-status-paywall { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid rgba(210,153,34,0.4); }
        .ref-status-standard { background: rgba(56,139,253,0.1); color: var(--text-main); }

        .related-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: var(--bg);
        }
        .related-header {
            font-size: 0.98rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }
        .related-header span {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 3px;
        }
        .related-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }
        .related-card:hover {
            border-color: rgba(88, 166, 255, 0.4);
        }
        .rel-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 6px;
            cursor: pointer;
            color: var(--text-main);
            line-height: 1.35;
        }
        .rel-title:hover {
            color: var(--accent);
            text-decoration: underline;
        }
        .rel-meta {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .relationship-box {
            background: rgba(56, 139, 253, 0.07);
            border: 1px solid rgba(56, 139, 253, 0.25);
            border-radius: 6px;
            padding: 10px 12px;
            margin: 10px 0;
            font-size: 0.8rem;
            line-height: 1.5;
            color: #d0d7de;
        }
        .relationship-box strong {
            color: #58a6ff;
            font-weight: 600;
        }
        .relationship-box em {
            color: #7ee787;
            font-style: normal;
            font-weight: 600;
        }
        .relationship-header {
            font-weight: 700;
            font-size: 0.74rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .shared-badge {
            display: inline-flex;
            background: rgba(35,134,54,0.15);
            color: #3fb950;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            margin: 6px 0;
            cursor: pointer;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(63,185,80,0.4);
            transition: all 0.2s ease;
        }
        .shared-badge:hover {
            background: rgba(35,134,54,0.3);
            border-color: #3fb950;
        }
        
        .shared-refs-dropdown {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: var(--panel-elevated);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .shared-refs-dropdown.open {
            display: block;
        }
        .why-key-box {
            background: rgba(46, 160, 67, 0.1);
            border: 1px solid rgba(46, 160, 67, 0.3);
            border-radius: 6px;
            padding: 10px 12px;
            margin-bottom: 12px;
            font-size: 0.78rem;
            line-height: 1.45;
            color: #7ee787;
        }
        .ref-item {
            font-size: 0.8rem;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .ref-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .ref-title {
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .ref-meta {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-bottom: 6px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .ref-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .ref-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.74rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .ref-btn-pdf {
            background: rgba(35, 134, 54, 0.15);
            color: #3fb950;
            border: 1px solid rgba(63, 185, 80, 0.4);
        }
        .ref-btn-pdf:hover {
            background: rgba(35, 134, 54, 0.3);
        }
        .ref-btn-doi {
            background: rgba(88, 166, 255, 0.15);
            color: var(--accent);
            border: 1px solid rgba(88, 166, 255, 0.4);
        }
        .ref-btn-doi:hover {
            background: rgba(88, 166, 255, 0.3);
        }
        .ref-btn-s2 {
            background: rgba(56, 139, 253, 0.1);
            color: #a5d6ff;
            border: 1px solid rgba(56, 139, 253, 0.3);
        }
        .ref-btn-s2:hover {
            background: rgba(56, 139, 253, 0.25);
        }
        .ref-btn-scholar {
            background: rgba(137, 87, 229, 0.15);
            color: #d2a8ff;
            border: 1px solid rgba(137, 87, 229, 0.4);
        }
        .ref-btn-scholar:hover {
            background: rgba(137, 87, 229, 0.3);
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">ResearchRadar | Citation Graph</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchView('constellation')">3D Graph</button>
            <button class="tab-btn" onclick="switchView('timeline')">Timeline</button>
        </div>
    </header>

    <div class="main-container">
        <!-- TIMELINE VIEW -->
        <div id="timeline-view" class="view-section">
            <div class="timeline-container" id="timeline-container">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- CONSTELLATION VIEW -->
        <div id="constellation-view" class="view-section active">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="filters">
                    <button class="filter-btn active" onclick="setJourney('foundation', this)">🏛️ Foundations</button>
                    <button class="filter-btn" onclick="setJourney('frontier', this)">🚀 Frontier</button>
                    <button class="filter-btn" onclick="setJourney('all', this)">🔥 Top Cited</button>
                </div>
                <div class="paper-list" id="paper-list">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- Canvas -->
            <div class="canvas-container" id="canvas-container">
                <div class="scene-overlay">
                    <p>Drag to rotate · Scroll to zoom · Click node to focus</p>
                </div>
                <div id="labels-container"></div>
                <canvas id="webgl-canvas"></canvas>
            </div>

            <!-- Right Panel -->
            <div class="right-panel" id="right-panel">
                <div class="panel-resizer-left" id="panel-resizer-left" title="Drag to resize panel width"></div>
                <div class="focus-section" id="focus-section">
                    <!-- Injected via JS -->
                </div>
                <div class="vertical-splitter" id="v-splitter" title="Drag to adjust top/bottom view height">
                    <div class="splitter-handle"></div>
                </div>
                <div class="related-section" id="related-section">
                    <div class="related-header">
                        🔗 Related Papers (Shared References)
                        <span>Connected via common foundations</span>
                    </div>
                    <div id="related-list">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

        function initSplitters() {
            // Horizontal panel width resizer
            const panel = document.getElementById('right-panel');
            const resizerH = document.getElementById('panel-resizer-left');
            let isResizingH = false;

            if (resizerH && panel) {
                resizerH.addEventListener('mousedown', (e) => {
                    isResizingH = true;
                    resizerH.classList.add('dragging');
                    document.body.style.cursor = 'ew-resize';
                    e.preventDefault();
                });
            }

            // Vertical splitter between focus and related papers
            const focusSec = document.getElementById('focus-section');
            const resizerV = document.getElementById('v-splitter');
            let isResizingV = false;

            if (resizerV && focusSec && panel) {
                resizerV.addEventListener('mousedown', (e) => {
                    isResizingV = true;
                    resizerV.classList.add('dragging');
                    document.body.style.cursor = 'ns-resize';
                    e.preventDefault();
                });
            }

            window.addEventListener('mousemove', (e) => {
                if (isResizingH && panel) {
                    const newW = window.innerWidth - e.clientX;
                    if (newW >= 360 && newW <= window.innerWidth * 0.65) {
                        panel.style.width = newW + 'px';
                        onWindowResize();
                    }
                }
                if (isResizingV && focusSec && panel) {
                    const panelRect = panel.getBoundingClientRect();
                    const newH = e.clientY - panelRect.top;
                    if (newH >= 100 && newH <= panelRect.height - 120) {
                        focusSec.style.maxHeight = newH + 'px';
                        focusSec.style.height = newH + 'px';
                    }
                }
            });

            window.addEventListener('mouseup', () => {
                if (isResizingH) {
                    isResizingH = false;
                    if (resizerH) resizerH.classList.remove('dragging');
                    document.body.style.cursor = 'default';
                }
                if (isResizingV) {
                    isResizingV = false;
                    if (resizerV) resizerV.classList.remove('dragging');
                    document.body.style.cursor = 'default';
                }
            });

                        </div>
                        ${refsHtml}
                    </div>
                </div>
                `;
            }).join('');
            
            // Update 3D Constellation
            if (scene) {
                updateConstellation(paper);
            }
            
            switchView('constellation');
        }

        function toggleSharedRefs(idx) {
            const el = document.getElementById(`shared-refs-${idx}`);
            if (el) el.classList.toggle('open');
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = DATA.milestones.map(m => `
                <div class="milestone-item" onclick="selectPaper('${m.paper.id}')">
                    <div class="milestone-year-dot">${m.year}</div>
                    <div class="milestone-card">
                        <h3>${m.paper.title}</h3>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-bottom:8px;">${m.paper.authors} · ${m.paper.venue} · 🌐 ${m.paper.global_cits}</div>
                        <div style="font-size:0.9rem;">${m.paper.tldr || ''}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- Three.js Implementation ---

        function initThreeScene() {
            const container = document.getElementById('canvas-container');
            const canvas = document.getElementById('webgl-canvas');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.z = 25;
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();
            
            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);
            const point = new THREE.PointLight(0xffffff, 1);
            point.position.set(10, 10, 10);
            scene.add(point);
            
            // Events
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onMouseWheel);
            window.addEventListener('resize', onWindowResize);
            canvas.addEventListener('click', onMouseClick);
            
            animate();
        }
        
        function onMouseDown(e) {
            isDragging = true;
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        }
        
        function onMouseMove(e) {
            // Raycasting for hover
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes.map(n => n.mesh));
            
            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
            
            if (!isDragging) return;
            const deltaMove = {
                x: e.offsetX - previousMousePosition.x,
                y: e.offsetY - previousMousePosition.y
            };
            
            targetRotation.y += deltaMove.x * 0.01;
            targetRotation.x += deltaMove.y * 0.01;
            
            previousMousePosition = { x: e.offsetX, y: e.offsetY };
        }
        
        function onMouseUp() {
            isDragging = false;
        }
        
        function onMouseWheel(e) {
            e.preventDefault();
            camera.position.z += e.deltaY * 0.01;
            camera.position.z = Math.max(10, Math.min(50, camera.position.z));
        }
        
        function onMouseClick(e) {
            if (isDragging && (Math.abs(targetRotation.y - currentRotation.y) > 0.05)) return;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(nodes.map(n => n.mesh));
            if (intersects.length > 0) {
                const mesh = intersects[0].object;
                const node = nodes.find(n => n.mesh === mesh);
                if (node && node.id && node.id !== currentFocusId) {
                    selectPaper(node.id);
                }
            }
        }
        
        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function createNode(size, colorHex, pos, id, title, isCenter=false, rankTag="", sharedCount=0) {
            const geom = new THREE.SphereGeometry(size, 32, 32);
            const mat = new THREE.MeshPhongMaterial({
                color: colorHex,
                emissive: colorHex,
                emissiveIntensity: isCenter ? 0.5 : (rankTag ? 0.35 : 0.2),
                transparent: true,
                opacity: 0
            });
            const mesh = new THREE.Mesh(geom, mat);
            mesh.position.copy(pos);
            scene.add(mesh);
            
            // Add aura for center
            if (isCenter) {
                const auraGeom = new THREE.SphereGeometry(size * 1.5, 32, 32);
                const auraMat = new THREE.MeshBasicMaterial({
                    color: colorHex,
                    transparent: true,
                    opacity: 0
                });
                const aura = new THREE.Mesh(auraGeom, auraMat);
                mesh.add(aura);
            }
            
            // Subtle 1px accent outline ring for top-3 nodes sharing >3 key references
            let ring = null;
            if (rankTag) {
                const ringGeom = new THREE.RingGeometry(size * 1.35, size * 1.45, 48);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0x3fb950,
                    side: THREE.DoubleSide,
                    transparent: true,
                    opacity: 0.85
                });
                ring = new THREE.Mesh(ringGeom, ringMat);
                mesh.add(ring);
            }
            
            nodes.push({ mesh, id, title, targetOpacity: 1, isCenter, rankTag, sharedCount, ring });
        }
        
        function createEdge(startPos, endPos, weight) {
            const points = [startPos, endPos];
            const geom = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0,
                linewidth: weight
            });
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            edges.push({ line, targetOpacity: Math.min(0.8, weight * 0.15) });
        }

        function updateConstellation(paper) {
            if (!scene) return;
            
            // Clear previous scene elements
            nodes.forEach(n => scene.remove(n.mesh));
            edges.forEach(e => scene.remove(e.line));
            nodes = [];
            edges = [];
            
            // Reset rotation
            targetRotation = {x: 0, y: 0};
            currentRotation = {x: 0, y: 0};
            scene.rotation.set(0,0,0);
            
            // Create center
            const centerColor = COLORS[paper.badge_class] || COLORS.standard;
            createNode(1.5, centerColor, new THREE.Vector3(0,0,0), paper.id, paper.title, true);
            
            // Create satellites using fibonacci sphere
            const nSat = paper.related_papers ? paper.related_papers.length : 0;
            const radius = 8;
            
            // Identify Top 3 papers that strictly have > 3 key references
            const highShared = (paper.related_papers || []).filter(r => r.shared_count > 3);
            const rankMap = {};
            highShared.slice(0, 3).forEach((r, idx) => {
                rankMap[r.id] = `#${idx + 1} Shared`;
            });

            (paper.related_papers || []).forEach((rel, i) => {
                const phi = Math.acos(1 - 2 * (i + 0.5) / (nSat || 1));
                const theta = Math.PI * (1 + Math.sqrt(5)) * (i + 0.5);
                
                const x = radius * Math.sin(phi) * Math.cos(theta);
                const y = radius * Math.cos(phi);
                const z = radius * Math.sin(phi) * Math.sin(theta);
                
                const pos = new THREE.Vector3(x, y, z);
                const rankTag = rankMap[rel.id] || "";
                const relColor = rankTag ? 0x2ea043 : COLORS.standard;
                createNode(0.8, relColor, pos, rel.id, rel.title, false, rankTag, rel.shared_count);
                createEdge(new THREE.Vector3(0,0,0), pos, rel.shared_count);
            });
        }

        function updateLabels() {
            const container = document.getElementById('labels-container');
            container.innerHTML = '';
            
            const canvasRect = renderer.domElement.getBoundingClientRect();
            
            nodes.forEach(node => {
                if (node.mesh.material.opacity < 0.1) return;
                
                // Project 3D position to 2D
                const pos = node.mesh.position.clone();
                // apply scene rotation
                pos.applyEuler(scene.rotation);
                pos.project(camera);
                
                if (pos.z > 1) return; // behind camera
                
                const x = (pos.x * .5 + .5) * canvasRect.width;
                const y = (pos.y * -.5 + .5) * canvasRect.height;
                
                const label = document.createElement('div');
                label.className = `node-label visible ${node.rankTag ? 'top-shared' : ''}`;
                label.style.left = `${x}px`;
                label.style.top = `${y + (node.isCenter ? 30 : 20)}px`;
                
                let truncTitle = node.title.length > 30 ? node.title.substring(0, 30) + '...' : node.title;
                if (node.rankTag) {
                    label.innerHTML = `<span class="rank-chip">${node.rankTag} (${node.sharedCount} refs)</span><strong>${truncTitle}</strong>`;
                } else {
                    label.innerHTML = `<strong>${truncTitle}</strong>`;
                }
                container.appendChild(label);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Lerp rotation
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.1;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.1;
            
            scene.rotation.x = currentRotation.x;
            scene.rotation.y = currentRotation.y;
            
            // Lerp opacity and orient rings
            nodes.forEach(n => {
                n.mesh.material.opacity += (n.targetOpacity - n.mesh.material.opacity) * 0.1;
                if (n.isCenter && n.mesh.children[0]) {
                    n.mesh.children[0].material.opacity = n.mesh.material.opacity * 0.3;
                }
                if (n.ring) {
                    n.ring.quaternion.copy(camera.quaternion);
                }
            });
            edges.forEach(e => {
                e.line.material.opacity += (e.targetOpacity - e.line.material.opacity) * 0.1;
            });
            
            renderer.render(scene, camera);
            updateLabels();
        }

        window.onload = init;
    </script>
</body>
</html>
