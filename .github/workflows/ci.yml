name: ResearchRadar CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint & Verify Scientometric Pipeline
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Syntax & PyCompile Verification
      run: |
        python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('research_radar/**/*.py', recursive=True)]; print('SYNTAX CLEAN')"

    - name: Verify FastAPI Service Initialization
      run: |
        python -c "from research_radar.api import app; print(f'FastAPI initialized with {len(app.routes)} routes.')"

    - name: Validate Scientometric Formulas & Invariants
      run: |
        python -c "
        import math
        # Verify Brian Uzzi et al. Science 2013 null model formula
        k_i, k_j, N = 22, 25, 300
        mu = (k_i * k_j) / N
        denom = (N - k_i) * (N - k_j)
        sigma = math.sqrt((k_i * k_j * denom) / ((N**2) * (N - 1)))
        z = - (mu / sigma)
        assert round(z, 2) == -1.47, f'Uzzi z-score validation failed: {z}'
        print('SCIENTOMETRIC FORMULA INVARIANT VALIDATED: Uzzi z = -1.47 sigma')
        "
