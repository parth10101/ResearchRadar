version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: research_radar_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - S2_API_KEY=${S2_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: research_radar_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
